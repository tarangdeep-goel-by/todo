name: CI                                                  
                                         
on:                                                       
  push:                                                 
    branches: [main]                                      
  pull_request:                                           
    branches: [main]               
                                           
jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://todo:testpass@localhost:5432/todo_test
          GEMINI_API_KEY: test-key-not-real                       
          SARVAM_API_KEY: test-key-not-real                       
          FIREBASE_PROJECT_ID: test-project                       
          CORS_ORIGINS: http://localhost:8001
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --ignore=tests/performance
        env:
          DATABASE_URL: postgresql+asyncpg://todo:testpass@localhost:5432/todo_test
          POSTGRES_HOST: localhost                                
          POSTGRES_PASSWORD: testpass
          GEMINI_API_KEY: test-key-not-real
          SARVAM_API_KEY: test-key-not-real
          FIREBASE_PROJECT_ID: test-project
          APP_ENV: test
          
          ALLOW_TEST_AUTH: "true"
          SEARCH_ENGINE: pg_native
          REDIS_URL: redis://localhost:6379/0
          CORS_ORIGINS: http://localhost:8001

  frontend-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
    
  frontend-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
      - run: flutter pub get
      - run: flutter test
