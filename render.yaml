databases:
  - name: amble-db
    plan: free
    databaseName: amble_db
    user: amble

services:
  - type: web
    name: amble-api
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amble-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SEARCH_ENGINE
        value: pg_native
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
